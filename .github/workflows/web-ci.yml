name: Toonflow-web CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build web
        run: yarn build-only

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: toonflow-web-dist
          path: dist
          retention-days: 7